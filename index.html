<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Смотрим вместе — W2G</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #12151c;
      --header: #181c26;
      --panel: #1b202c;
      --card: #252b3b;
      --border: #2e3548;
      --text: #f3f4f6;
      --hint: #9ca3af;
      --yellow: #eab308;
      --yellow-hover: #ca8a04;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --green: #16a34a;
      --red: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; }

    /* === ВЕРХНЯЯ ПАНЕЛЬ КАК В W2G === */
    .topbar {
      height: 54px;
      background: var(--header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .logo-box {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: linear-gradient(135deg, #eab308, #d97706);
      color: #111;
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .room-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--hint);
      display: none;
    }
    @media (min-width: 640px) { .room-title { display: inline; } }

    .search-bar {
      flex: 1;
      max-width: 560px;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .search-bar:focus-within { border-color: var(--yellow); }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      min-width: 0;
    }
    .search-bar input:focus { outline: none; }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--hint);
      padding: 0 8px;
      cursor: pointer;
      font-size: 15px;
    }
    .clear-btn:hover { color: var(--text); }

    .load-submit {
      background: var(--card);
      border: none;
      border-left: 1px solid var(--border);
      color: var(--text);
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .load-submit:hover { background: #31394f; }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .users-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--card);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--yellow);
    }
    .status-dot.online { background: var(--green); }

    .invite-btn {
      background: var(--yellow);
      color: #111827;
      border: none;
      padding: 7px 13px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .invite-btn:hover { background: var(--yellow-hover); }

    /* === ОСНОВНАЯ СЕТКА === */
    .workspace {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 54px);
      width: 100%;
    }
    @media (min-width: 880px) { .workspace { flex-direction: row; } }

    .stage-col {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      flex-shrink: 0;
    }
    @media (min-width: 880px) {
      .stage-col { flex: 1; height: 100%; min-width: 0; overflow-y: auto; }
    }

    .player-box {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
      max-height: 44vh;
    }
    @media (min-width: 880px) {
      .player-box { max-height: 68vh; aspect-ratio: 16 / 9; }
    }

    .media-el {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      display: none;
    }
    .media-el.active { display: block; }

    #playOverlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 15;
    }
    #playOverlay.show { display: flex; }
    #playOverlay button {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* === НИЖНЯЯ ПАНЕЛЬ УЧАСТНИКОВ И КОНТРОЛОВ (КАК В W2G) === */
    .stage-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .avatars-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-card {
      position: relative;
      width: 78px;
      height: 78px;
      border-radius: 8px;
      background: linear-gradient(145deg, #374151, #1f2937);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
    }
    .user-card:hover { border-color: var(--yellow); }

    .avatar-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #6b7280;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .crown-badge {
      position: absolute;
      left: 4px;
      bottom: 22px;
      font-size: 14px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
    }

    .user-name-tag {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--green);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 2px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-name-tag.guest { background: var(--blue); }

    .stage-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ctrl-btn:hover { background: #31394f; }
    .ctrl-btn.active-gold { border-color: var(--yellow); color: var(--yellow); }
    .ctrl-btn.active-red { background: var(--red); border-color: var(--red); color: #fff; }

    /* === ПРАВАЯ ПАНЕЛЬ: ЧАТ И ИСТОРИЯ === */
    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
    }
    @media (min-width: 880px) {
      .sidebar { width: 360px; flex: none; height: 100%; border-left: 1px solid var(--border); }
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--header);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--hint);
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--yellow);
    }

    .tab-pane {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }
    .tab-pane.active { display: flex; }

    #chatList, #historyList {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .chat-msg {
      background: var(--card);
      padding: 8px 11px;
      border-radius: 10px;
      align-self: flex-start;
      max-width: 86%;
      font-size: 13px;
      line-height: 1.38;
      word-wrap: break-word;
    }
    .chat-msg.me {
      background: #2b354b;
      align-self: flex-end;
      border: 1px solid #3b4866;
    }
    .chat-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: var(--hint);
      margin-bottom: 3px;
      font-weight: 600;
    }
    .chat-time { font-weight: 400; font-size: 10px; opacity: 0.8; }

    .sys-note {
      align-self: center;
      font-size: 11px;
      color: var(--hint);
      text-align: center;
      padding: 2px 6px;
    }

    /* Карточка видео в чате как на скриншоте W2G */
    .media-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      align-self: stretch;
      font-size: 12px;
    }
    .media-card-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .media-card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .play-link {
      color: #60a5fa;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
    }

    .emoji-strip {
      display: flex;
      gap: 4px;
      padding: 6px 10px 0;
      flex-shrink: 0;
    }
    .emoji-btn {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-form {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .chat-form input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 14px;
      min-width: 0;
    }
    .chat-form input:focus { outline: none; border-color: var(--yellow); }
    .send-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    .send-btn:hover { background: var(--blue); border-color: var(--blue); }

    /* === МОДАЛЬНЫЕ ОКНА (ПРИВЕТСТВИЕ И ПРИГЛАШЕНИЕ) === */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 11, 16, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #232836;
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 100%;
      max-width: 480px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fff;
    }

    .modal-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      display: block;
    }

    .modal-input {
      width: 100%;
      background: #171b24;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .modal-input:focus { outline: none; border-color: var(--blue); }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: var(--hint);
      margin-bottom: 18px;
      cursor: pointer;
    }

    .primary-modal-btn {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-modal-btn:hover { background: var(--blue-hover); }

    .invite-copy-row {
      display: flex;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .invite-copy-row input {
      flex: 1;
      background: #fff;
      color: #111;
      border: none;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .invite-copy-row button {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 0 18px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .invite-info {
      background: #2c3244;
      border-radius: 7px;
      padding: 12px;
      font-size: 12px;
      color: #d1d5db;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .modal-footer-right {
      display: flex;
      justify-content: flex-end;
    }
    .close-modal-btn {
      background: #374151;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="topbar">
    <div class="brand">
      <div class="logo-box">W</div>
      <span class="room-title" id="roomLabel">Комната</span>
    </div>

    <div class="search-bar">
      <input id="urlInput" type="text" placeholder="Вставьте ссылку на видео (YouTube, Google Диск, .mp4, .m3u8, VK)..." />
      <button id="clearUrlBtn" class="clear-btn" title="Очистить">✕</button>
      <button id="loadBtn" class="load-submit">Включить</button>
    </div>

    <div class="top-actions">
      <div class="users-pill" title="Статус подключения и участники">
        <span id="connDot" class="status-dot"></span>
        <span>👤 <span id="userCount">1</span></span>
      </div>
      <button id="openInviteBtn" class="invite-btn">+ Пригласить</button>
    </div>
  </header>

  <!-- РАБОЧАЯ ОБЛАСТЬ -->
  <main class="workspace">
    <section class="stage-col">
      <div class="player-box">
        <video id="htmlPlayer" class="media-el active" controls playsinline webkit-playsinline></video>
        <div id="ytContainer" class="media-el"></div>
        <iframe id="embedPlayer" class="media-el" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        <div id="playOverlay">
          <button id="unlockPlayBtn">▶️ Нажмите, чтобы запустить видео</button>
        </div>
      </div>

      <div class="stage-footer">
        <div class="avatars-row" id="avatarsRow"></div>

        <div class="stage-controls">
          <button id="driveModeBtn" class="ctrl-btn" style="display:none;" title="Переключить между прямым потоком и плеером Google">🔄 Режим Диска</button>
          <button id="syncBtn" class="ctrl-btn admin-only" title="Подтянуть всех на мою секунду">⏱ Синхр.</button>
          <button id="lockBtn" class="ctrl-btn admin-only active-gold" title="Управление плеером">🔒 Только админ</button>
          <button id="screenBtn" class="ctrl-btn admin-only" title="Транслировать вкладку браузера со звуком">🖥 Экран</button>
          <button id="micBtn" class="ctrl-btn" title="Голосовой чат">🎙 Голос</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="chat">Чат</button>
        <button class="tab-btn" data-tab="history">История</button>
      </div>

      <div id="tab-chat" class="tab-pane active">
        <div id="chatList"></div>
        <div class="emoji-strip">
          <button class="emoji-btn" data-emoji="😂">😂</button>
          <button class="emoji-btn" data-emoji="❤️">❤️</button>
          <button class="emoji-btn" data-emoji="😱">😱</button>
          <button class="emoji-btn" data-emoji="🔥">🔥</button>
          <button class="emoji-btn" data-emoji="😭">😭</button>
        </div>
        <div class="chat-form">
          <input id="chatInput" type="text" placeholder="Написать сообщение..." autocomplete="off" />
          <button id="sendBtn" class="send-btn">➤</button>
        </div>
      </div>

      <div id="tab-history" class="tab-pane">
        <div id="historyList"></div>
      </div>
    </aside>
  </main>

  <!-- МОДАЛКА ПРИВЕТСТВИЯ (КАК В WATCH2GETHER) -->
  <div id="welcomeModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title">Добро пожаловать!</div>
      <label class="modal-label" for="welcomeNameInput">Выбрать имя</label>
      <input id="welcomeNameInput" class="modal-input" type="text" maxlength="20" placeholder="Введите ваше имя..." />
      <label class="checkbox-row">
        <input id="skipWelcomeCheck" type="checkbox" checked />
        <span>Запомнить имя и не спрашивать при обновлении страницы</span>
      </label>
      <button id="joinRoomBtn" class="primary-modal-btn">Присоединиться к комнате</button>
    </div>
  </div>

  <!-- МОДАЛКА ПРИГЛАШЕНИЯ (КАК В WATCH2GETHER) -->
  <div id="inviteModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title">Пригласите друзей посмотреть с Вами видео!</div>
      <label class="modal-label">Поделитесь с ними этой ссылкой:</label>
      <div class="invite-copy-row">
        <input id="inviteLinkInput" type="text" readonly />
        <button id="copyInviteBtn">Копировать</button>
      </div>
      <div class="invite-info">
        Отправьте эту ссылку девушке или друзьям. Комната автоматически сохраняет историю и синхронизацию даже после обновления страницы и работает с любым VPN.
      </div>
      <div class="modal-footer-right">
        <button id="closeInviteBtn" class="close-modal-btn">Закрыть</button>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const GOOGLE_API_KEY = "AIzaSyBcV_OlMU2CpZ1WO9n_bPF_j7CytgrZSuU";

    // === УСТОЙЧИВОЕ ХРАНИЛИЩЕ УСТРОЙСТВА ===
    const STORE = {
      get(k, def = null) {
        try {
          const v = localStorage.getItem(k);
          return v !== null ? JSON.parse(v) : def;
        } catch { return def; }
      },
      set(k, v) {
        try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
      }
    };

    // Постоянный ID устройства (не сбрасывается при перезагрузке и смене VPN)
    let DEVICE_ID = STORE.get("w2g_device_id");
    if (!DEVICE_ID) {
      DEVICE_ID = "dev-" + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
      STORE.set("w2g_device_id", DEVICE_ID);
    }

    // Определение ID комнаты (?r=... или ?room=...)
    const params = new URLSearchParams(window.location.search);
    let roomId = (params.get("r") || params.get("room") || "").trim();
    const ownedRooms = STORE.get("w2g_owned_rooms", {});

    if (!roomId) {
      roomId = Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 6);
      ownedRooms[roomId] = true;
      STORE.set("w2g_owned_rooms", ownedRooms);
      window.history.replaceState({}, "", `?r=${roomId}`);
    }

    // Имя пользователя
    let myName = STORE.get("w2g_user_name", "");
    if (!myName) {
      myName = "User-" + DEVICE_ID.slice(-5).toUpperCase();
    }

    // Состояние комнаты (восстанавливается из локального кэша мгновенно до ответа сети)
    const LOCAL_STATE_KEY = `w2g_room_cache_${roomId}`;
    let roomState = STORE.get(LOCAL_STATE_KEY, {
      adminId: ownedRooms[roomId] ? DEVICE_ID : "",
      locked: true,
      url: "",
      title: "",
      driveEmbedMode: false,
      time: 0,
      paused: true,
      updatedAt: Date.now(),
      history: [],
      messages: []
    });

    function saveLocalState() {
      STORE.set(LOCAL_STATE_KEY, roomState);
    }

    function isMeAdmin() {
      if (ownedRooms[roomId]) return true;
      if (!roomState.adminId) return true;
      return roomState.adminId === DEVICE_ID;
    }

    // === DOM ЭЛЕМЕНТЫ ===
    const htmlPlayer = document.getElementById("htmlPlayer");
    const ytContainer = document.getElementById("ytContainer");
    const embedPlayer = document.getElementById("embedPlayer");
    const playOverlay = document.getElementById("playOverlay");
    const unlockPlayBtn = document.getElementById("unlockPlayBtn");
    const urlInput = document.getElementById("urlInput");
    const connDot = document.getElementById("connDot");
    const userCountEl = document.getElementById("userCount");
    const avatarsRow = document.getElementById("avatarsRow");
    const chatList = document.getElementById("chatList");
    const historyList = document.getElementById("historyList");
    const chatInput = document.getElementById("chatInput");
    const driveModeBtn = document.getElementById("driveModeBtn");
    const syncBtn = document.getElementById("syncBtn");
    const lockBtn = document.getElementById("lockBtn");
    const screenBtn = document.getElementById("screenBtn");
    const micBtn = document.getElementById("micBtn");
    const remoteAudio = document.getElementById("remoteAudio");

    document.getElementById("roomLabel").textContent = `Комната #${roomId.slice(0, 6)}`;

    const welcomeNameInput = document.getElementById("welcomeNameInput");

    document.getElementById("joinRoomBtn").onclick = () => {
      const val = welcomeNameInput.value.trim();

      STORE.set("w2g_skip_welcome", skipWelcomeCheck.checked);

      publishPresence();
      renderAvatars();

    // === МОДАЛКА ПРИГЛАШЕНИЯ ===
    const inviteModal = document.getElementById("inviteModal");
    const inviteLinkInput = document.getElementById("inviteLinkInput");
    const copyInviteBtn = document.getElementById("copyInviteBtn");

    document.getElementById("openInviteBtn").onclick = () => {
      const cleanLink = `${window.location.origin}${window.location.pathname}?r=${roomId}`;
      inviteLinkInput.value = cleanLink;
      inviteModal.classList.add("open");
    };
    document.getElementById("closeInviteBtn").onclick = () => inviteModal.classList.remove("open");
    inviteModal.onclick = (e) => { if (e.target === inviteModal) inviteModal.classList.remove("open"); };

    copyInviteBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(inviteLinkInput.value);
        copyInviteBtn.textContent = "Скопировано!";
        copyInviteBtn.style.background = "#16a34a";
        setTimeout(() => {
          copyInviteBtn.textContent = "Копировать";
          copyInviteBtn.style.background = "";

        document.execCommand("copy");

    // === ВКЛАДКИ СПРАВА ===
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
      };
    });

    // === УЧАСТНИКИ И КАРТОЧКИ С КОРОНОЙ ===
    const onlinePeers = new Map(); // deviceId -> { deviceId, name, isAdmin, lastSeen }

    function renderAvatars() {
      const adminFlag = isMeAdmin();
      onlinePeers.set(DEVICE_ID, {
        deviceId: DEVICE_ID,
        name: myName,
        isAdmin: adminFlag,
        lastSeen: Date.now()
      });

      // Удаляем зависших оффлайн-участников (>35 сек без пинга)
      const now = Date.now();
      for (const [id, info] of onlinePeers.entries()) {
        if (id !== DEVICE_ID && now - info.lastSeen > 35000) {
          onlinePeers.delete(id);
        }
      }

      userCountEl.textContent = onlinePeers.size;
      avatarsRow.innerHTML = "";

      onlinePeers.forEach((u) => {
        const card = document.createElement("div");

        circle.className = "avatar-circle";
        circle.textContent = (u.name || "U").slice(0, 1).toUpperCase();
        card.appendChild(circle);

        if (u.isAdmin || u.deviceId === roomState.adminId) {
          const crown = document.createElement("span");
          crown.className = "crown-badge";
          crown.textContent = "👑";
          card.appendChild(crown);
        }

        const tag = document.createElement("div");
        tag.className = "user-name-tag" + (u.deviceId === DEVICE_ID ? "" : " guest");
        tag.textContent = u.name;
        card.appendChild(tag);

        if (u.deviceId === DEVICE_ID) {
          card.onclick = () => {
            welcomeNameInput.value = myName;
            welcomeModal.classList.add("open");
          };
        }

        avatarsRow.appendChild(card);
      });

      // Обновляем видимость кнопок админа
      document.querySelectorAll(".admin-only").forEach(el => {
        el.style.display = adminFlag ? "flex" : "none";
      });
      lockBtn.textContent = roomState.locked ? "🔒 Только админ" : "🔓 Все управляют";
      lockBtn.classList.toggle("active-gold", roomState.locked);
    }

    // === УПРАВЛЕНИЕ ПЛЕЕРОМ ===
    let activeMode = "html5"; // 'html5' | 'youtube' | 'embed' | 'screen'
    let hlsInstance = null;
    let ytPlayer = null;
    let ytReady = false;
    let pendingYt = null;
    let isRemoteAction = false;
    let lastDriveId = "";
    let lastYtTime = 0;

    function switchMode(mode) {
      activeMode = mode;
      playOverlay.classList.remove("show");
      htmlPlayer.classList.toggle("active", mode === "html5" || mode === "screen");
      ytContainer.classList.toggle("active", mode === "youtube");
      embedPlayer.classList.toggle("active", mode === "embed");

      if (mode !== "html5" && mode !== "screen") {
        htmlPlayer.pause();
        htmlPlayer.srcObject = null;
        htmlPlayer.removeAttribute("src");
      }
      if (mode !== "youtube" && ytPlayer && ytReady) {
        ytPlayer.pauseVideo();
      }
      if (mode !== "embed") {
        embedPlayer.src = "about:blank";
      }
    }

    unlockPlayBtn.onclick = () => {
      playOverlay.classList.remove("show");
      if (activeMode === "youtube" && ytReady) {
        ytPlayer.playVideo();
      } else {
        htmlPlayer.play().catch(() => {});
      }
    };

    // YouTube IFrame API
    const ytTag = document.createElement("script");
    ytTag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytTag);

    window.onYouTubeIframeAPIReady = () => {
      ytPlayer = new YT.Player("ytContainer", {
        width: "100%",
        height: "100%",
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => {
            ytReady = true;
            if (pendingYt) {
              const p = pendingYt;
              pendingYt = null;
              startYouTube(p.id, p.time, p.play);
            }
          },
          onStateChange: (e) => {
            if (isRemoteAction || activeMode !== "youtube") return;
            if (!isMeAdmin() && roomState.locked) {
              if (e.data === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
              return;
            }
            const t = ytPlayer.getCurrentTime?.() || 0;
            if (e.data === YT.PlayerState.PLAYING) {
              sendPlaybackUpdate(t, false, "play");
            } else if (e.data === YT.PlayerState.PAUSED) {
              sendPlaybackUpdate(t, true, "pause");
            }
          }
        }
      });
    };

    function startYouTube(videoId, startTime = 0, shouldPlay = false) {
      switchMode("youtube");
      if (!ytReady) {
        pendingYt = { id: videoId, time: startTime, play: shouldPlay };
        return;
      }
      isRemoteAction = true;
      ytPlayer.loadVideoById({ videoId, startSeconds: startTime });
      if (!shouldPlay) {
        setTimeout(() => ytPlayer.pauseVideo(), 400);
      } else {
        setTimeout(() => {
          if (ytPlayer.getPlayerState?.() !== YT.PlayerState.PLAYING) {
            playOverlay.classList.add("show");
          }
        }, 1200);
      }
      lastYtTime = startTime;
      setTimeout(() => { isRemoteAction = false; }, 700);
    }

    setInterval(() => {
      if (activeMode === "youtube" && ytReady && !isRemoteAction) {
        const cur = ytPlayer.getCurrentTime?.() || 0;
        if (Math.abs(cur - lastYtTime) > 1.8 && (isMeAdmin() || !roomState.locked)) {
          sendPlaybackUpdate(cur, ytPlayer.getPlayerState?.() !== YT.PlayerState.PLAYING, "seek");
        }
        lastYtTime = cur;
      }
    }, 600);

    function safeHtmlPlay() {
      htmlPlayer.play().then(() => {
        playOverlay.classList.remove("show");
      }).catch(() => {
        playOverlay.classList.add("show");
      });
    }

    function startHtml5(streamUrl, startTime = 0, shouldPlay = false) {
      switchMode("html5");
      htmlPlayer.srcObject = null;
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

      isRemoteAction = true;
      if (streamUrl.includes(".m3u8") && window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(htmlPlayer);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          htmlPlayer.currentTime = startTime;
          if (shouldPlay) safeHtmlPlay();
        });
      } else {
        htmlPlayer.src = streamUrl;
        htmlPlayer.currentTime = startTime;
        if (shouldPlay) safeHtmlPlay();
      }
      setTimeout(() => { isRemoteAction = false; }, 600);
    }

    function parseMediaLink(raw) {
      const clean = raw.trim();
      const yt = clean.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (yt) return { kind: "youtube", id: yt[1] };

      const gd = clean.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_-]{20,})/);
      if (gd) return { kind: "gdrive", id: gd[1] };

      const vk = clean.match(/vk\.(?:com|ru)\/video(-?\d+)_(\d+)/);
      if (vk) return { kind: "embed", url: `https://vk.com/video_ext.php?oid=${vk[1]}&id=${vk[2]}&hd=2` };

      const rt = clean.match(/rutube\.ru\/video\/([a-zA-Z0-9]+)/);
      if (rt) return { kind: "embed", url: `https://rutube.ru/play/embed/${rt[1]}` };

      return { kind: "direct", url: clean };
    }

    async function resolveTitle(rawUrl, parsed) {
      try {
        if (parsed.kind === "youtube") {
          const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${parsed.id}&format=json`);
          if (res.ok) {
            const j = await res.json();
            return j.title || rawUrl;
          }
        } else if (parsed.kind === "gdrive") {
          const res = await fetch(`https://www.googleapis.com/drive/v3/files/${parsed.id}?fields=name&key=${GOOGLE_API_KEY}`);
          if (res.ok) {
            const j = await res.json();
            return j.name || "Видео с Google Диска";
          }
        }
      } catch {}
      return rawUrl.length > 55 ? rawUrl.slice(0, 52) + "..." : rawUrl;
    }

    async function applyMedia(url, startTime = 0, shouldPlay = false, forceDriveEmbed = false) {
      if (!url) return;
      urlInput.value = url;
      driveModeBtn.style.display = "none";

      const parsed = parseMediaLink(url);

      if (parsed.kind === "youtube") {
        startYouTube(parsed.id, startTime, shouldPlay);
        return;
      }

      if (parsed.kind === "embed") {
        switchMode("embed");
        embedPlayer.src = parsed.url;
        return;
      }

      if (parsed.kind === "gdrive") {
        lastDriveId = parsed.id;
        driveModeBtn.style.display = "flex";

        // Проверяем, нужно ли сразу открыть резервный плеер Google (для .mkv или принудительно)
        let useEmbed = forceDriveEmbed;
        if (!useEmbed) {
          try {
            const metaRes = await fetch(`https://www.googleapis.com/drive/v3/files/${parsed.id}?fields=name&key=${GOOGLE_API_KEY}`);
            if (!metaRes.ok) {
              useEmbed = true;
            } else {
              const meta = await metaRes.json();
              if (meta.name && /\.(mkv|avi|wmv)$/i.test(meta.name)) {
                useEmbed = true;
              }
            }
          } catch {
            useEmbed = true;
          }
        }

        if (useEmbed) {
          switchMode("embed");
          embedPlayer.src = `https://drive.google.com/file/d/${parsed.id}/preview`;
        } else {
          const stream = `https://www.googleapis.com/drive/v3/files/${parsed.id}?alt=media&acknowledgeAbuse=true&key=${GOOGLE_API_KEY}`;
          startHtml5(stream, startTime, shouldPlay);
        }
        return;
      }

      startHtml5(parsed.url, startTime, shouldPlay);
    }

    // Если прямой поток Google Диска не сыграл в браузере — автоматически переключаем на /preview
    htmlPlayer.addEventListener("error", () => {
      if (activeMode === "html5" && lastDriveId && htmlPlayer.src.includes("googleapis.com")) {
        switchMode("embed");
        embedPlayer.src = `https://drive.google.com/file/d/${lastDriveId}/preview`;
        addSysNote("Переключено на встроенный плеер Google Диска");
      }
    });

    driveModeBtn.onclick = () => {
      if (!lastDriveId) return;
      const nextMode = activeMode !== "embed";
      roomState.driveEmbedMode = nextMode;
      saveLocalState();
      applyMedia(roomState.url, 0, false, nextMode);
      if (isMeAdmin()) publishRoomState();
    };

    // События HTML5 плеера
    ["play", "pause", "seeked"].forEach(ev => {
      htmlPlayer.addEventListener(ev, () => {
        if (isRemoteAction || activeMode !== "html5") return;
        if (!isMeAdmin() && roomState.locked) {
          // Возвращаем гостя к состоянию комнаты
          syncLocalToState();
          return;
        }
        const action = ev === "seeked" ? "seek" : ev;
        sendPlaybackUpdate(htmlPlayer.currentTime, htmlPlayer.paused, action);
      });
    });

    function getLiveTime() {
      if (activeMode === "youtube" && ytReady) return ytPlayer.getCurrentTime?.() || 0;
      return htmlPlayer.currentTime || 0;
    }

    function getLivePaused() {
      if (activeMode === "youtube" && ytReady) return ytPlayer.getPlayerState?.() !== YT.PlayerState.PLAYING;
      return htmlPlayer.paused;
    }

    // === ЧАТ И ИСТОРИЯ (С СОХРАНЕНИЕМ ПОСЛЕ ОБНОВЛЕНИЯ) ===
    function formatTime(ts) {
      const d = new Date(ts || Date.now());
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function addSysNote(text) {
      const div = document.createElement("div");
      div.className = "sys-note";
      div.textContent = text;
      chatList.appendChild(div);
      chatList.scrollTop = chatList.scrollHeight;
    }

    function renderChatAndHistory() {
      chatList.innerHTML = "";
      (roomState.messages || []).forEach(m => {
        if (m.kind === "media") {
          const card = document.createElement("div");
          card.className = "media-card";
          card.innerHTML = `
            <div class="media-card-title">🎬 ${escapeHtml(m.title || m.url)}</div>
            <div class="media-card-actions">
              <button class="play-link">Play</button>
              <span class="chat-time">${formatTime(m.ts)}</span>
            </div>
          `;
          card.querySelector(".play-link").onclick = () => triggerNewVideo(m.url, m.title);
          chatList.appendChild(card);
        } else {
          const div = document.createElement("div");
          div.className = "chat-msg" + (m.deviceId === DEVICE_ID ? " me" : "");
          div.innerHTML = `
            <div class="chat-meta">
              <span>${escapeHtml(m.sender)}</span>
              <span class="chat-time">${formatTime(m.ts)}</span>
            </div>
            <div>${escapeHtml(m.text)}</div>
          `;
          chatList.appendChild(div);
        }
      });
      chatList.scrollTop = chatList.scrollHeight;

      historyList.innerHTML = "";
      (roomState.history || []).slice().reverse().forEach(item => {
        const card = document.createElement("div");
        card.className = "media-card";
        card.innerHTML = `
          <div class="media-card-title">${escapeHtml(item.title || item.url)}</div>
          <div class="media-card-actions">
            <button class="play-link">Play</button>
            <span class="chat-time">${formatTime(item.ts)}</span>
          </div>
        `;
        card.querySelector(".play-link").onclick = () => triggerNewVideo(item.url, item.title);
        historyList.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // === СЕТЕВОЙ ДВИЖОК (MQTT OVER WSS — РАБОТАЕТ С VPN И БЕЗ) ===
    const BROKERS = [
      "wss://broker.emqx.io:8084/mqtt",
      "wss://broker.hivemq.com:8884/mqtt"
    ];
    let brokerIdx = 0;
    let mqttClient = null;
    const TOPIC_ROOT = `w2g-sync-v1/${roomId}`;

    function connectBroker() {
      if (mqttClient) {
        try { mqttClient.end(true); } catch {}
      }

      const brokerUrl = BROKERS[brokerIdx % BROKERS.length];
      mqttClient = mqtt.connect(brokerUrl, {
        clientId: `${DEVICE_ID}-${Math.random().toString(36).slice(2, 6)}`,
        clean: true,
        connectTimeout: 6000,
        reconnectPeriod: 2000,
        keepalive: 20,
        will: {
          topic: `${TOPIC_ROOT}/presence/${DEVICE_ID}`,
          payload: "",
          qos: 1,
          retain: true
        }
      });

      mqttClient.on("connect", () => {
        connDot.classList.add("online");
        mqttClient.subscribe(`${TOPIC_ROOT}/state`, { qos: 1 });
        mqttClient.subscribe(`${TOPIC_ROOT}/cmd`, { qos: 1 });
        mqttClient.subscribe(`${TOPIC_ROOT}/presence/+`, { qos: 1 });
        publishPresence();

        // Если мы создатель комнаты и на сервере ещё пусто — записываем наше состояние
        if (ownedRooms[roomId] && roomState.url) {
          publishRoomState();
        }
      });

      mqttClient.on("offline", () => connDot.classList.remove("online"));
      mqttClient.on("error", () => {
        connDot.classList.remove("online");
        brokerIdx++;
      });

      mqttClient.on("message", (topic, buf) => {
        const raw = buf.toString();

        // Присутствие участников
        if (topic.startsWith(`${TOPIC_ROOT}/presence/`)) {
          const devId = topic.split("/").pop();
          if (!raw) {
            onlinePeers.delete(devId);
          } else {
            try {
              const info = JSON.parse(raw);
              info.lastSeen = Date.now();
              onlinePeers.set(devId, info);
            } catch {}
          }
          renderAvatars();
          return;
        }

        if (!raw) return;
        let data;
        try { data = JSON.parse(raw); } catch { return; }

        // Полное сохраняемое состояние комнаты
        if (topic === `${TOPIC_ROOT}/state`) {
          const prevUrl = roomState.url;
          const prevUpdated = roomState.updatedAt || 0;
          if (data.updatedAt && data.updatedAt < prevUpdated && ownedRooms[roomId]) {
            return;
          }

          roomState = { ...roomState, ...data };
          if (ownedRooms[roomId]) roomState.adminId = DEVICE_ID;
          saveLocalState();
          renderAvatars();
          renderChatAndHistory();

          if (roomState.url && roomState.url !== prevUrl) {
            const elapsed = roomState.paused ? 0 : Math.max(0, (Date.now() - roomState.updatedAt) / 1000);
            applyMedia(roomState.url, (roomState.time || 0) + elapsed, !roomState.paused, roomState.driveEmbedMode);
          } else if (roomState.url) {
            syncLocalToState();
          }
          return;
        }

        // Мгновенные команды (пауза, перемотка, чат)
        if (topic === `${TOPIC_ROOT}/cmd`) {
          if (data.senderId === DEVICE_ID) return;

          if (data.type === "playback") {
            roomState.time = data.time;
            roomState.paused = data.paused;
            roomState.updatedAt = data.updatedAt || Date.now();
            saveLocalState();
            syncLocalToState();
          } else if (data.type === "chat") {
            roomState.messages = [...(roomState.messages || []).slice(-60), data.msg];
            saveLocalState();
            renderChatAndHistory();
          } else if (data.type === "lock") {
            roomState.locked = data.locked;
            saveLocalState();
            renderAvatars();
          }
        }
      });
    }

    function publishPresence() {
      if (!mqttClient || !mqttClient.connected) return;
      mqttClient.publish(
        `${TOPIC_ROOT}/presence/${DEVICE_ID}`,
        JSON.stringify({
          deviceId: DEVICE_ID,
          name: myName,
          isAdmin: isMeAdmin(),
          ts: Date.now()
        }),
        { retain: true, qos: 1 }
      );
    }

    function publishRoomState() {
      roomState.updatedAt = Date.now();
      saveLocalState();
      if (!mqttClient || !mqttClient.connected) return;
      mqttClient.publish(`${TOPIC_ROOT}/state`, JSON.stringify(roomState), { retain: true, qos: 1 });
    }

    function syncLocalToState() {
      if (!roomState.url) return;
      const elapsed = roomState.paused ? 0 : Math.max(0, (Date.now() - (roomState.updatedAt || Date.now())) / 1000);
      const targetTime = (roomState.time || 0) + elapsed;

      isRemoteAction = true;
      if (activeMode === "youtube" && ytReady) {
        const cur = ytPlayer.getCurrentTime?.() || 0;
        if (Math.abs(cur - targetTime) > 1.5) ytPlayer.seekTo(targetTime, true);
        if (roomState.paused) ytPlayer.pauseVideo();
        else ytPlayer.playVideo();
      } else if (activeMode === "html5") {
        if (Math.abs(htmlPlayer.currentTime - targetTime) > 1.2) htmlPlayer.currentTime = targetTime;
        if (roomState.paused) htmlPlayer.pause();
        else safeHtmlPlay();
      }
      setTimeout(() => { isRemoteAction = false; }, 500);
    }

    function sendPlaybackUpdate(time, paused, action) {
      roomState.time = time;
      roomState.paused = paused;
      roomState.updatedAt = Date.now();
      saveLocalState();

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`${TOPIC_ROOT}/cmd`, JSON.stringify({
          type: "playback",
          senderId: DEVICE_ID,
          action,
          time,
          paused,
          updatedAt: roomState.updatedAt
        }), { qos: 1 });

        if (isMeAdmin()) {
          mqttClient.publish(`${TOPIC_ROOT}/state`, JSON.stringify(roomState), { retain: true, qos: 1 });
        }
      }
    }

    // Периодический пинг присутствия и времени админа
    setInterval(() => {
      publishPresence();
      if (isMeAdmin() && roomState.url && !getLivePaused()) {
        roomState.time = getLiveTime();
        roomState.paused = false;
        publishRoomState();
      }
    }, 8000);

    // === ЗАПУСК НОВОГО ВИДЕО ===
    async function triggerNewVideo(rawUrl, knownTitle = null) {
      const clean = rawUrl.trim();
      if (!clean) return;
      if (!isMeAdmin() && roomState.locked) {
        addSysNote("Только админ может менять видео в этой комнате");
        return;
      }

      const parsed = parseMediaLink(clean);
      const title = knownTitle || await resolveTitle(clean, parsed);
      const entry = { kind: "media", url: clean, title, ts: Date.now() };

      roomState.url = clean;
      roomState.title = title;
      roomState.driveEmbedMode = false;
      roomState.time = 0;
      roomState.paused = false;
      roomState.updatedAt = Date.now();
      roomState.history = [...(roomState.history || []).slice(-29), entry];
      roomState.messages = [...(roomState.messages || []).slice(-60), entry];

      saveLocalState();
      renderChatAndHistory();
      applyMedia(clean, 0, true, false);
      publishRoomState();
    }

    document.getElementById("loadBtn").onclick = () => triggerNewVideo(urlInput.value);
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") triggerNewVideo(urlInput.value); });
    document.getElementById("clearUrlBtn").onclick = () => { urlInput.value = ""; urlInput.focus(); };

    // === КНОПКИ АДМИНА ===
    syncBtn.onclick = () => {
      if (!isMeAdmin()) return;
      roomState.time = getLiveTime();
      roomState.paused = getLivePaused();
      publishRoomState();
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`${TOPIC_ROOT}/cmd`, JSON.stringify({
          type: "playback",
          senderId: DEVICE_ID,
          action: "sync",
          time: roomState.time,
          paused: roomState.paused,
          updatedAt: roomState.updatedAt
        }), { qos: 1 });
      }
      addSysNote("Время синхронизировано для всех участников");
    };

    lockBtn.onclick = () => {
      if (!isMeAdmin()) return;
      roomState.locked = !roomState.locked;
      renderAvatars();
      publishRoomState();
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`${TOPIC_ROOT}/cmd`, JSON.stringify({
          type: "lock",
          senderId: DEVICE_ID,
          locked: roomState.locked
        }), { qos: 1 });
      }
    };

    // === ОТПРАВКА СООБЩЕНИЙ ===
    function sendChat(customText = null) {
      const text = (customText ?? chatInput.value).trim();
      if (!text) return;
      const msg = {
        kind: "text",
        deviceId: DEVICE_ID,
        sender: myName,
        text,
        ts: Date.now()
      };
      roomState.messages = [...(roomState.messages || []).slice(-60), msg];
      saveLocalState();
      renderChatAndHistory();

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`${TOPIC_ROOT}/cmd`, JSON.stringify({
          type: "chat",
          senderId: DEVICE_ID,
          msg
        }), { qos: 1 });
        if (isMeAdmin()) publishRoomState();
      }
      if (!customText) chatInput.value = "";
    }

    document.getElementById("sendBtn").onclick = () => sendChat();
    chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });
    document.querySelectorAll(".emoji-btn").forEach(b => {
      b.onclick = () => sendChat(b.dataset.emoji);
    });

    // === ГОЛОС И СТРИМ ВКЛАДКИ (ОПЦИОНАЛЬНО) ===
    let peer = null;
    let voiceStream = null;
    let screenStream = null;

    function ensurePeer() {
      if (peer) return peer;
      peer = new Peer(DEVICE_ID, {
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
          ]
        }
      });
      peer.on("call", (call) => {
        const kind = call.metadata?.kind || "voice";
        call.answer(kind === "voice" ? (voiceStream || undefined) : undefined);
        call.on("stream", (stream) => {
          if (kind === "screen") {
            switchMode("screen");
            htmlPlayer.srcObject = stream;
            htmlPlayer.muted = false;
            safeHtmlPlay();
          } else {
            remoteAudio.srcObject = stream;
          }
        });
      });
      return peer;
    }

    micBtn.onclick = async () => {
      if (voiceStream) {
        voiceStream.getTracks().forEach(t => t.stop());
        voiceStream = null;
        micBtn.textContent = "🎙 Голос";
        micBtn.classList.remove("active-red");
        return;
      }
      try {
        ensurePeer();
        voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micBtn.textContent = "🔴 В эфире";
        micBtn.classList.add("active-red");
        onlinePeers.forEach((_, id) => {
          if (id !== DEVICE_ID) peer.call(id, voiceStream, { metadata: { kind: "voice" } });
        });
      } catch {
        alert("Разрешите доступ к микрофону в настройках браузера");
      }
    };

    screenBtn.onclick = async () => {
      if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
        screenBtn.textContent = "🖥 Экран";
        screenBtn.classList.remove("active-red");
        switchMode("html5");
        return;
      }
      try {
        ensurePeer();
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
        screenBtn.textContent = "⏹ Стоп";
        screenBtn.classList.add("active-red");
        switchMode("screen");
        htmlPlayer.srcObject = screenStream;
        htmlPlayer.muted = true;
        htmlPlayer.play();
        onlinePeers.forEach((_, id) => {
          if (id !== DEVICE_ID) peer.call(id, screenStream, { metadata: { kind: "screen" } });
        });
        screenStream.getVideoTracks()[0].onended = () => { if (screenStream) screenBtn.click(); };
      } catch {}
    };

    // === ИНИЦИАЛИЗАЦИЯ ПРИ СТАРТЕ / ПЕРЕЗАГРУЗКЕ ===
    renderAvatars();
    renderChatAndHistory();
    if (roomState.url) {
      const elapsed = roomState.paused ? 0 : Math.max(0, (Date.now() - (roomState.updatedAt || Date.now())) / 1000);
      applyMedia(roomState.url, (roomState.time || 0) + elapsed, !roomState.paused, roomState.driveEmbedMode);
    }
    connectBroker();
  </script>
</body>
</html>
