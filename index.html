<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Смотрим вместе</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #18181c;
      --card: #222228;
      --border: #2e2e36;
      --text: #f4f4f6;
      --hint: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --gold: #eab308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; }

    .app { display: flex; flex-direction: column; height: 100dvh; width: 100%; }
    @media (min-width: 860px) { .app { flex-direction: row; } }

    /* Левая / верхняя колонка */
    .main-col { display: flex; flex-direction: column; background: #000; flex-shrink: 0; }
    @media (min-width: 860px) { .main-col { flex: 1; height: 100%; min-width: 0; } }

    .video-wrap {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16 / 9;
      max-height: 44vh;
    }
    @media (min-width: 860px) {
      .video-wrap { flex: 1; max-height: none; aspect-ratio: auto; min-height: 0; }
    }

    .media-el {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      display: none;
    }
    .media-el.active { display: block; }

    /* Панель управления */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 10px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .status-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .badge {
      padding: 4px 9px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card);
      color: var(--hint);
      white-space: nowrap;
    }
    .badge.online { background: var(--green); color: #fff; }
    .badge.admin { background: rgba(234, 179, 8, 0.18); color: var(--gold); border: 1px solid rgba(234, 179, 8, 0.4); }

    .name-input {
      width: 105px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .tool-btns { display: flex; gap: 5px; flex-wrap: wrap; }

    button {
      padding: 6px 10px;
      border-radius: 7px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #2c2c34; }
    button.active-red { background: var(--red); border-color: var(--red); color: #fff; }
    button.active-gold { background: rgba(234, 179, 8, 0.2); border: 1px solid var(--gold); color: var(--gold); }

    /* Выдвижная панель источников */
    #setupPanel {
      background: var(--panel);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    #setupPanel.hidden { display: none; }

    .row { display: flex; gap: 6px; }
    input[type="text"] {
      flex: 1;
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-width: 0;
    }
    input:focus { outline: none; border-color: var(--accent); }

    .hint-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--hint);
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Правая / нижняя колонка: чат */
    .chat-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      padding: 8px 10px;
      gap: 8px;
    }
    @media (min-width: 860px) {
      .chat-col { width: 350px; flex: none; height: 100%; border-left: 1px solid var(--border); }
    }

    #chatBox {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px;
      scroll-behavior: smooth;
    }

    .msg {
      padding: 7px 11px;
      border-radius: 12px;
      background: var(--card);
      align-self: flex-start;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.38;
      word-wrap: break-word;
    }
    .msg.me { background: var(--accent); color: #fff; align-self: flex-end; }
    .msg.sys {
      background: transparent;
      color: var(--hint);
      font-size: 12px;
      align-self: center;
      text-align: center;
      padding: 2px 6px;
    }
    .msg-author { font-size: 11px; opacity: 0.78; margin-bottom: 2px; font-weight: 600; }

    .reactions { display: flex; gap: 6px; flex-shrink: 0; }
    .react-btn {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 5px;
      font-size: 16px;
      border-radius: 8px;
      flex: 1;
    }

    .chat-input-row { display: flex; gap: 6px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="app">
    <div class="main-col">
      <div class="video-wrap">
        <video id="htmlPlayer" class="media-el active" controls playsinline webkit-playsinline></video>
        <div id="ytContainer" class="media-el"></div>
        <iframe id="embedPlayer" class="media-el" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>

      <div class="toolbar">
        <div class="status-group">
          <span id="connBadge" class="badge">Ожидание</span>
          <span id="roleBadge" class="badge">Гость</span>
          <input id="nameInput" class="name-input" placeholder="Твоё имя" maxlength="20" />
        </div>
        <div class="tool-btns">
          <button id="inviteBtn">Пригласить</button>
          <button id="screenBtn" class="secondary admin-only" title="Транслировать вкладку браузера со звуком">🖥 Стрим вкладки</button>
          <button id="syncBtn" class="secondary admin-only" title="Принудительно синхронизировать партнёра">🔄 Синхр.</button>
          <button id="lockBtn" class="secondary admin-only" title="Запретить гостям перематывать">🔒 Только админ</button>
          <button id="micBtn" class="secondary">🎙 Голос</button>
          <button id="toggleSetupBtn" class="secondary">⚙️</button>
        </div>
      </div>

      <div id="setupPanel">
        <div class="row">
          <input id="urlInput" type="text" placeholder="Ссылка: YouTube, Google Диск, .mp4, .m3u8, VK..." />
          <button id="loadBtn">Включить</button>
        </div>
        <div class="hint-bar">
          <span>Поддерживается: YouTube, Google Диск, прямые .mp4/.m3u8, VK Видео</span>
          <button id="driveFallbackBtn" class="secondary" style="display:none; padding: 3px 8px; font-size: 11px;">Резервный плеер Google (для .mkv)</button>
        </div>
        <div class="row">
          <input id="joinInput" type="text" placeholder="Код комнаты друга (если заходишь без ссылки)..." />
          <button id="joinBtn" class="secondary">Войти</button>
        </div>
      </div>
    </div>

    <div class="chat-col">
      <div id="chatBox"></div>
      <div class="reactions">
        <button class="react-btn" data-emoji="😂">😂</button>
        <button class="react-btn" data-emoji="❤️">❤️</button>
        <button class="react-btn" data-emoji="😱">😱</button>
        <button class="react-btn" data-emoji="🔥">🔥</button>
        <button class="react-btn" data-emoji="😭">😭</button>
      </div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Написать сообщение..." autocomplete="off" />
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const GOOGLE_API_KEY = "AIzaSyBcV_OlMU2CpZ1WO9n_bPF_j7CytgrZSuU";

    // === ПАМЯТЬ УСТРОЙСТВА ===
    const STORAGE = {
      get(key, fallback = null) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? JSON.parse(val) : fallback;
        } catch { return fallback; }
      },
      set(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get("room")?.trim() || "";

    // DOM элементы
    const htmlPlayer = document.getElementById("htmlPlayer");
    const ytContainer = document.getElementById("ytContainer");
    const embedPlayer = document.getElementById("embedPlayer");
    const connBadge = document.getElementById("connBadge");
    const roleBadge = document.getElementById("roleBadge");
    const nameInput = document.getElementById("nameInput");
    const inviteBtn = document.getElementById("inviteBtn");
    const screenBtn = document.getElementById("screenBtn");
    const syncBtn = document.getElementById("syncBtn");
    const lockBtn = document.getElementById("lockBtn");
    const micBtn = document.getElementById("micBtn");
    const setupPanel = document.getElementById("setupPanel");
    const urlInput = document.getElementById("urlInput");
    const loadBtn = document.getElementById("loadBtn");
    const driveFallbackBtn = document.getElementById("driveFallbackBtn");
    const chatBox = document.getElementById("chatBox");
    const chatInput = document.getElementById("chatInput");
    const remoteAudio = document.getElementById("remoteAudio");

    // Восстановление имени и прав админа
    nameInput.value = STORAGE.get("cinema_name", "");
    nameInput.addEventListener("input", () => STORAGE.set("cinema_name", nameInput.value.trim()));

    const ownedRooms = STORAGE.get("cinema_owned_rooms", {});
    let currentRoomId = roomFromUrl || ("kino-" + Math.random().toString(36).substring(2, 8));

    // Если комнаты нет в URL, мы её создаём и запоминаем за этим устройством
    if (!roomFromUrl) {
      ownedRooms[currentRoomId] = true;
      STORAGE.set("cinema_owned_rooms", ownedRooms);
      window.history.replaceState({}, "", `?room=${currentRoomId}`);
    }

    let isAdmin = Boolean(ownedRooms[currentRoomId]);
    let adminLocked = true;

    // Состояние плеера
    let activeMode = "html5"; // 'html5' | 'youtube' | 'embed' | 'screen'
    let currentRawUrl = STORAGE.get("cinema_last_url", "");
    if (currentRawUrl) urlInput.value = currentRawUrl;
    let lastDriveFileId = "";

    let hlsInstance = null;
    let ytPlayer = null;
    let ytReady = false;
    let pendingYtLoad = null;
    let lastYtTime = 0;

    // Сеть (PeerJS)
    let peer = null;
    const connections = new Map();
    let voiceStream = null;
    let screenStream = null;
    let isRemoteAction = false;

    function getMyName() {
      return nameInput.value.trim() || (isAdmin ? "Админ" : "Гость");
    }

    function updateRoleUI() {
      if (isAdmin) {
        roleBadge.textContent = "👑 Админ";
        roleBadge.classList.add("admin");
        document.querySelectorAll(".admin-only").forEach(el => el.style.display = "");
      } else {
        roleBadge.textContent = "Гость";
        roleBadge.classList.remove("admin");
        document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
      }
      lockBtn.textContent = adminLocked ? "🔒 Только админ" : "🔓 Все управляют";
      lockBtn.classList.toggle("active-gold", adminLocked);
    }
    updateRoleUI();

    function addChatMessage(sender, text, type = "other") {
      const div = document.createElement("div");
      if (type === "sys") {
        div.className = "msg sys";
        div.textContent = text;
      } else {
        div.className = "msg" + (type === "me" ? " me" : "");
        if (type !== "me") {
          const author = document.createElement("div");
          author.className = "msg-author";
          author.textContent = sender;
          div.appendChild(author);
        }
        const body = document.createElement("div");
        body.textContent = text;
        div.appendChild(body);
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function broadcast(payload) {
      connections.forEach(c => {
        if (c.open) c.send(payload);
      });
    }

    function updateConnBadge() {
      const count = Array.from(connections.values()).filter(c => c.open).length;
      if (count > 0) {
        connBadge.textContent = count === 1 ? "Вместе онлайн" : `Онлайн: ${count + 1}`;
        connBadge.classList.add("online");
      } else {
        connBadge.textContent = "Ожидание партнёра";
        connBadge.classList.remove("online");
      }
    }

    // === ПЕРЕКЛЮЧЕНИЕ ТИПОВ ПЛЕЕРА ===
    function switchPlayerMode(mode) {
      activeMode = mode;
      htmlPlayer.classList.toggle("active", mode === "html5" || mode === "screen");
      ytContainer.classList.toggle("active", mode === "youtube");
      embedPlayer.classList.toggle("active", mode === "embed");

      if (mode !== "html5" && mode !== "screen") {
        htmlPlayer.pause();
        htmlPlayer.srcObject = null;
        htmlPlayer.removeAttribute("src");
      }
      if (mode !== "youtube" && ytPlayer && ytReady) {
        ytPlayer.pauseVideo();
      }
      if (mode !== "embed") {
        embedPlayer.src = "about:blank";
      }
    }

    // === YOUTUBE API ===
    const ytScript = document.createElement("script");
    ytScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytScript);

    window.onYouTubeIframeAPIReady = () => {
      ytPlayer = new YT.Player("ytContainer", {
        width: "100%",
        height: "100%",
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => {
            ytReady = true;
            if (pendingYtLoad) {
              const { id, time, play } = pendingYtLoad;
              pendingYtLoad = null;
              loadYouTubeVideo(id, time, play);
            }
          },
          onStateChange: (e) => {
            if (isRemoteAction || activeMode !== "youtube") return;
            if (!isAdmin && adminLocked) {
              // Возвращаем гостя обратно если управление заблокировано
              if (e.data === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
              return;
            }
            const t = ytPlayer.getCurrentTime();
            if (e.data === YT.PlayerState.PLAYING) {
              broadcast({ type: "action", action: "play", time: t });
            } else if (e.data === YT.PlayerState.PAUSED) {
              broadcast({ type: "action", action: "pause", time: t });
            }
          }
        }
      });
    };

    function loadYouTubeVideo(videoId, startTime = 0, shouldPlay = false) {
      switchPlayerMode("youtube");
      if (!ytReady) {
        pendingYtLoad = { id: videoId, time: startTime, play: shouldPlay };
        return;
      }
      isRemoteAction = true;
      ytPlayer.loadVideoById({ videoId, startSeconds: startTime });
      if (!shouldPlay) {
        setTimeout(() => ytPlayer.pauseVideo(), 350);
      }
      lastYtTime = startTime;
      setTimeout(() => { isRemoteAction = false; }, 700);
    }

    // Отслеживание перемотки в YouTube
    setInterval(() => {
      if (activeMode === "youtube" && ytReady && !isRemoteAction) {
        const cur = ytPlayer.getCurrentTime?.() || 0;
        if (Math.abs(cur - lastYtTime) > 1.8) {
          if (isAdmin || !adminLocked) {
            broadcast({ type: "action", action: "seek", time: cur });
          }
        }
        lastYtTime = cur;
      }
    }, 600);

    // === РАЗБОР ССЫЛОК (YOUTUBE, GOOGLE DRIVE, ВК, ПРЯМЫЕ) ===
    function detectSource(raw) {
      const clean = raw.trim();

      // YouTube
      const ytMatch = clean.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) return { type: "youtube", id: ytMatch[1] };

      // Google Drive
      const driveMatch = clean.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_-]{20,})/);
      if (driveMatch) return { type: "gdrive", id: driveMatch[1] };

      // VK Video
      const vkMatch = clean.match(/vk\.(?:com|ru)\/video(-?\d+)_(\d+)/);
      if (vkMatch) return { type: "embed", url: `https://vk.com/video_ext.php?oid=${vkMatch[1]}&id=${vkMatch[2]}&hd=2` };

      // Rutube
      const rtMatch = clean.match(/rutube\.ru\/video\/([a-zA-Z0-9]+)/);
      if (rtMatch) return { type: "embed", url: `https://rutube.ru/play/embed/${rtMatch[1]}` };

      // Прямой поток (.mp4 / .m3u8 / .webm)
      return { type: "direct", url: clean };
    }

    function safeHtmlPlay() {
      htmlPlayer.play().catch(() => {
        addChatMessage("", "Нажми Play на плеере один раз (браузер ждёт подтверждения звука)", "sys");
      });
    }

    function attachHtmlStream(streamUrl, startTime = 0, shouldPlay = false) {
      switchPlayerMode("html5");
      htmlPlayer.srcObject = null;
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

      isRemoteAction = true;
      if (streamUrl.includes(".m3u8") && window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(htmlPlayer);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          htmlPlayer.currentTime = startTime;
          if (shouldPlay) safeHtmlPlay();
        });
      } else {
        htmlPlayer.src = streamUrl;
        htmlPlayer.currentTime = startTime;
        if (shouldPlay) safeHtmlPlay();
      }
      setTimeout(() => { isRemoteAction = false; }, 600);
    }

    async function loadSource(rawUrl, startTime = 0, shouldPlay = false) {
      if (!rawUrl) return;
      currentRawUrl = rawUrl;
      urlInput.value = rawUrl;
      STORAGE.set("cinema_last_url", rawUrl);
      driveFallbackBtn.style.display = "none";

      const src = detectSource(rawUrl);

      if (src.type === "youtube") {
        addChatMessage("", "Загружаю видео с YouTube...", "sys");
        loadYouTubeVideo(src.id, startTime, shouldPlay);
        return;
      }

      if (src.type === "embed") {
        switchPlayerMode("embed");
        embedPlayer.src = src.url;
        addChatMessage("", "Открыт встроенный плеер (пауза/перемотка в этом режиме вручную)", "sys");
        return;
      }

      if (src.type === "gdrive") {
        lastDriveFileId = src.id;
        driveFallbackBtn.style.display = "inline-block";
        addChatMessage("", "Проверяю файл на Google Диске...", "sys");

        try {
          const metaRes = await fetch(`https://www.googleapis.com/drive/v3/files/${src.id}?fields=name,mimeType,size&key=${GOOGLE_API_KEY}`);
          if (!metaRes.ok) {
            const err = await metaRes.json().catch(() => ({}));
            const msg = err.error?.message || `код ${metaRes.status}`;
            addChatMessage("", `Google Диск не отдал файл (${msg}). Убедись, что включён доступ «Все, у кого есть ссылка»`, "sys");
            return;
          }
          const meta = await metaRes.json();
          if (meta.name && meta.name.toLowerCase().endsWith(".mkv")) {
            addChatMessage("", `Файл "${meta.name}" в формате .mkv — если не пойдёт звук или картинка, нажми «Резервный плеер Google»`, "sys");
          }
        } catch (e) {
          addChatMessage("", "Пробую запустить поток с Google Диска...", "sys");
        }

        const directDriveStream = `https://www.googleapis.com/drive/v3/files/${src.id}?alt=media&acknowledgeAbuse=true&key=${GOOGLE_API_KEY}`;
        attachHtmlStream(directDriveStream, startTime, shouldPlay);
        return;
      }

      // Прямая ссылка
      attachHtmlStream(src.url, startTime, shouldPlay);
    }

    driveFallbackBtn.onclick = () => {
      if (!lastDriveFileId) return;
      const previewUrl = `https://drive.google.com/file/d/${lastDriveFileId}/preview`;
      switchPlayerMode("embed");
      embedPlayer.src = previewUrl;
      if (isAdmin) broadcast({ type: "force_embed", url: previewUrl });
      addChatMessage("", "Включён резервный плеер Google Диска", "sys");
    };

    htmlPlayer.addEventListener("error", () => {
      if (activeMode !== "html5" || !htmlPlayer.src || htmlPlayer.src === window.location.href) return;
      addChatMessage("", "Браузер не смог открыть этот поток напрямую. Если это Google Диск — нажми «Резервный плеер Google» в настройках ⚙️", "sys");
    });

    // === УПРАВЛЕНИЕ И СИНХРОНИЗАЦИЯ ===
    function getCurrentPlaybackState() {
      if (activeMode === "youtube" && ytReady) {
        return {
          time: ytPlayer.getCurrentTime?.() || 0,
          paused: ytPlayer.getPlayerState?.() !== YT.PlayerState.PLAYING
        };
      }
      return {
        time: htmlPlayer.currentTime || 0,
        paused: htmlPlayer.paused
      };
    }

    function applyRemotePlayback(data) {
      isRemoteAction = true;
      if (activeMode === "youtube" && ytReady) {
        if (Math.abs((ytPlayer.getCurrentTime?.() || 0) - data.time) > 1.0) {
          ytPlayer.seekTo(data.time, true);
        }
        if (data.action === "play") ytPlayer.playVideo();
        if (data.action === "pause") ytPlayer.pauseVideo();
      } else if (activeMode === "html5") {
        if (Math.abs(htmlPlayer.currentTime - data.time) > 0.8) {
          htmlPlayer.currentTime = data.time;
        }
        if (data.action === "play") safeHtmlPlay();
        if (data.action === "pause") htmlPlayer.pause();
      }
      setTimeout(() => { isRemoteAction = false; }, 500);
    }

    // События HTML5 плеера
    ["play", "pause", "seeked"].forEach(ev => {
      htmlPlayer.addEventListener(ev, () => {
        if (isRemoteAction || activeMode !== "html5") return;
        if (!isAdmin && adminLocked) {
          // Гостю запрещено управлять — запрашиваем актуальное время у админа
          broadcast({ type: "request_sync" });
          return;
        }
        const action = ev === "seeked" ? "seek" : ev;
        broadcast({ type: "action", action, time: htmlPlayer.currentTime });
      });
    });

    // Heartbeat от админа каждые 4 секунды
    setInterval(() => {
      if (!isAdmin || connections.size === 0) return;
      if (activeMode === "html5" && !htmlPlayer.paused) {
        broadcast({ type: "heartbeat", time: htmlPlayer.currentTime, paused: false });
      } else if (activeMode === "youtube" && ytReady && ytPlayer.getPlayerState?.() === YT.PlayerState.PLAYING) {
        broadcast({ type: "heartbeat", time: ytPlayer.getCurrentTime(), paused: false });
      }
    }, 4000);

    // === СЕТЕВОЕ ПОДКЛЮЧЕНИЕ (PeerJS) ===
    function setupConnection(conn) {
      connections.set(conn.peer, conn);

      conn.on("open", () => {
        updateConnBadge();
        addChatMessage("", "Участник подключился к комнате", "sys");

        if (isAdmin) {
          const state = getCurrentPlaybackState();
          conn.send({
            type: "sync_full",
            url: currentRawUrl,
            mode: activeMode,
            time: state.time,
            paused: state.paused,
            adminLocked
          });
          if (screenStream) {
            peer.call(conn.peer, screenStream, { metadata: { type: "screen" } });
          }
        }
        if (voiceStream) {
          peer.call(conn.peer, voiceStream, { metadata: { type: "voice" } });
        }
      });

      conn.on("data", (data) => {
        if (data.type === "load") {
          loadSource(data.url, 0, false);
          addChatMessage("", "Включено новое видео", "sys");
        } else if (data.type === "force_embed") {
          switchPlayerMode("embed");
          embedPlayer.src = data.url;
        } else if (data.type === "sync_full") {
          adminLocked = data.adminLocked;
          updateRoleUI();
          if (data.mode === "screen") {
            switchPlayerMode("screen");
            addChatMessage("", "Админ транслирует вкладку браузера...", "sys");
          } else if (data.url) {
            loadSource(data.url, data.time, !data.paused);
          }
        } else if (data.type === "lock_state") {
          adminLocked = data.adminLocked;
          updateRoleUI();
          addChatMessage("", adminLocked ? "Админ заблокировал перемотку для гостей" : "Админ разрешил всем управлять плеером", "sys");
        } else if (data.type === "action") {
          applyRemotePlayback(data);
        } else if (data.type === "request_sync" && isAdmin) {
          const state = getCurrentPlaybackState();
          conn.send({ type: "action", action: state.paused ? "pause" : "play", time: state.time });
        } else if (data.type === "heartbeat" && !isAdmin) {
          const state = getCurrentPlaybackState();
          if (Math.abs(state.time - data.time) > 1.6 || state.paused !== data.paused) {
            applyRemotePlayback({ action: data.paused ? "pause" : "play", time: data.time });
          }
        } else if (data.type === "chat") {
          addChatMessage(data.sender, data.text, "other");
        }
      });

      conn.on("close", () => {
        connections.delete(conn.peer);
        updateConnBadge();
        addChatMessage("", "Участник вышел из комнаты", "sys");
      });
    }

    function initPeer() {
      if (peer) peer.destroy();
      peer = isAdmin ? new Peer(currentRoomId) : new Peer();

      peer.on("open", () => {
        if (!isAdmin) {
          setupConnection(peer.connect(currentRoomId));
        }
      });

      peer.on("error", (err) => {
        if (err.type === "unavailable-id" && isAdmin) {
          // Если комната с таким ID уже висит в сети, подключаемся к ней
          setupConnection(peer.connect(currentRoomId));
        } else if (err.type === "peer-unavailable") {
          addChatMessage("", "Комната пока не активна — ждём, когда админ откроет страницу", "sys");
        }
      });

      peer.on("connection", (incomingConn) => setupConnection(incomingConn));

      peer.on("call", (call) => {
        const callType = call.metadata?.type || "voice";
        call.answer(callType === "voice" ? (voiceStream || undefined) : undefined);

        call.on("stream", (remoteStream) => {
          if (callType === "screen") {
            switchPlayerMode("screen");
            htmlPlayer.srcObject = remoteStream;
            htmlPlayer.muted = false;
            safeHtmlPlay();
            addChatMessage("", "Получен стрим вкладки от админа", "sys");
          } else {
            remoteAudio.srcObject = remoteStream;
          }
        });
      });
    }

    initPeer();

    // === КНОПКИ АДМИНА И УПРАВЛЕНИЯ ===
    loadBtn.onclick = () => {
      if (!isAdmin && adminLocked) {
        addChatMessage("", "Только админ может менять видео", "sys");
        return;
      }
      const url = urlInput.value.trim();
      if (!url) return;
      loadSource(url, 0, false);
      broadcast({ type: "load", url });
      setupPanel.classList.add("hidden");
    };

    syncBtn.onclick = () => {
      if (!isAdmin) return;
      const state = getCurrentPlaybackState();
      broadcast({
        type: "sync_full",
        url: currentRawUrl,
        mode: activeMode,
        time: state.time,
        paused: state.paused,
        adminLocked
      });
      addChatMessage("", "Команда синхронизации отправлена", "sys");
    };

    lockBtn.onclick = () => {
      if (!isAdmin) return;
      adminLocked = !adminLocked;
      updateRoleUI();
      broadcast({ type: "lock_state", adminLocked });
    };

    // Стрим вкладки браузера / экрана
    screenBtn.onclick = async () => {
      if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
        screenBtn.textContent = "🖥 Стрим вкладки";
        screenBtn.classList.remove("active-red");
        switchPlayerMode("html5");
        addChatMessage("", "Трансляция вкладки остановлена", "sys");
        return;
      }
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 },
          audio: true
        });
        screenBtn.textContent = "⏹ Стоп стрим";
        screenBtn.classList.add("active-red");
        switchPlayerMode("screen");
        htmlPlayer.srcObject = screenStream;
        htmlPlayer.muted = true; // у себя отключаем звук превью, чтобы не двоилось
        htmlPlayer.play();
        addChatMessage("", "Трансляция вкладки запущена! Выбери вкладку с фильмом", "sys");

        connections.forEach(c => {
          if (c.open) peer.call(c.peer, screenStream, { metadata: { type: "screen" } });
        });

        screenStream.getVideoTracks()[0].onended = () => {
          if (screenStream) screenBtn.click();
        };
      } catch (e) {
        addChatMessage("", "Трансляция отменена или не поддерживается этим браузером", "sys");
      }
    };

    // Голосовой чат
    micBtn.onclick = async () => {
      if (voiceStream) {
        voiceStream.getTracks().forEach(t => t.stop());
        voiceStream = null;
        micBtn.textContent = "🎙 Голос";
        micBtn.classList.remove("active-red");
        addChatMessage("", "Микрофон выключен", "sys");
        return;
      }
      try {
        voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micBtn.textContent = "🔴 В эфире";
        micBtn.classList.add("active-red");
        addChatMessage("", "Микрофон включён", "sys");
        connections.forEach(c => {
          if (c.open) peer.call(c.peer, voiceStream, { metadata: { type: "voice" } });
        });
      } catch (e) {
        alert("Браузер не дал доступ к микрофону. Разреши доступ в настройках сайта.");
      }
    };

    // Чат
    function sendMessage(customText = null) {
      const text = (customText ?? chatInput.value).trim();
      if (!text) return;
      const sender = getMyName();
      addChatMessage(sender, text, "me");
      broadcast({ type: "chat", sender, text });
      if (!customText) chatInput.value = "";
    }

    document.getElementById("sendBtn").onclick = () => sendMessage();
    chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
    document.querySelectorAll(".react-btn").forEach(btn => {
      btn.onclick = () => sendMessage(btn.dataset.emoji);
    });

    // Настройки и приглашение
    document.getElementById("toggleSetupBtn").onclick = () => setupPanel.classList.toggle("hidden");

    inviteBtn.onclick = async () => {
      const baseUrl = window.location.origin + window.location.pathname;
      const inviteLink = `${baseUrl}?room=${currentRoomId}`;
      try {
        await navigator.clipboard.writeText(inviteLink);
        const orig = inviteBtn.textContent;
        inviteBtn.textContent = "✓ Скопировано!";
        setTimeout(() => { inviteBtn.textContent = orig; }, 2200);
      } catch {
        prompt("Скопируй ссылку для партнёра:", inviteLink);
      }
    };

    document.getElementById("joinBtn").onclick = () => {
      const raw = document.getElementById("joinInput").value.trim();
      if (!raw) return;
      const match = raw.match(/room=([a-zA-Z0-9-]+)/);
      currentRoomId = match ? match[1] : raw;
      isAdmin = Boolean(ownedRooms[currentRoomId]);
      window.history.replaceState({}, "", `?room=${currentRoomId}`);
      updateRoleUI();
      initPeer();
      setupPanel.classList.add("hidden");
    };
  </script>
</body>
</html>
