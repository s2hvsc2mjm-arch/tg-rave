<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Смотрим вместе</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #18181c;
      --card: #222228;
      --border: #2e2e36;
      --text: #f4f4f6;
      --hint: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

    /* Основной контейнер: на телефоне колонка, на ПК — плеер слева, чат справа */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    @media (min-width: 820px) {
      .app { flex-direction: row; }
    }

    /* Левая / верхняя часть: видео + панель управления */
    .main-col {
      display: flex;
      flex-direction: column;
      background: #000;
      flex-shrink: 0;
    }

    @media (min-width: 820px) {
      .main-col {
        flex: 1;
        height: 100%;
        min-width: 0;
      }
    }

    .video-wrap {
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      max-height: 42vh;
      display: block;
      background: #000;
    }

    @media (min-width: 820px) {
      .video-wrap { flex: 1; min-height: 0; }
      video { max-height: 100%; height: 100%; }
    }

    /* Тулбар под видео */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card);
      color: var(--hint);
      white-space: nowrap;
    }

    .badge.online {
      background: var(--green);
      color: #fff;
    }

    .name-input {
      width: 110px;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .tool-btns {
      display: flex;
      gap: 6px;
    }

    button {
      padding: 7px 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #2c2c34; }
    button.mic-on { background: var(--red); border-color: var(--red); }

    /* Панель ссылки и входа */
    #setupPanel {
      background: var(--panel);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    #setupPanel.hidden { display: none; }

    .row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      min-width: 0;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Правая / нижняя часть: чат */
    .chat-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      padding: 10px;
      gap: 8px;
    }

    @media (min-width: 820px) {
      .chat-col {
        width: 360px;
        flex: none;
        height: 100%;
        border-left: 1px solid var(--border);
      }
    }

    #chatBox {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px;
      scroll-behavior: smooth;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--card);
      align-self: flex-start;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .msg.me {
      background: var(--accent);
      color: #fff;
      align-self: flex-end;
    }

    .msg.sys {
      background: transparent;
      color: var(--hint);
      font-size: 12px;
      align-self: center;
      text-align: center;
      padding: 3px 6px;
    }

    .msg-author {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 2px;
      font-weight: 600;
    }

    .reactions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .react-btn {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px;
      font-size: 16px;
      border-radius: 8px;
      flex: 1;
    }

    .chat-input-row {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- Плеер и управление -->
    <div class="main-col">
      <div class="video-wrap">
        <video id="player" controls playsinline webkit-playsinline></video>
      </div>

      <div class="toolbar">
        <div class="status-group">
          <span id="connBadge" class="badge">Ожидание партнёра</span>
          <input id="nameInput" class="name-input" placeholder="Твоё имя" maxlength="20" />
        </div>
        <div class="tool-btns">
          <button id="inviteBtn">Пригласить</button>
          <button id="micBtn" class="secondary">🎙 Голос</button>
          <button id="toggleSetupBtn" class="secondary">⚙️ Ссылка</button>
        </div>
      </div>

      <div id="setupPanel">
        <div class="row">
          <input id="urlInput" type="text" placeholder="Вставь ссылку на видео с Google Диска..." />
          <button id="loadBtn">Включить</button>
        </div>
        <div class="row">
          <input id="joinInput" type="text" placeholder="Или вставь код комнаты друга..." />
          <button id="joinBtn" class="secondary">Войти</button>
        </div>
      </div>
    </div>

    <!-- Чат -->
    <div class="chat-col">
      <div id="chatBox"></div>
      <div class="reactions">
        <button class="react-btn" data-emoji="😂">😂</button>
        <button class="react-btn" data-emoji="❤️">❤️</button>
        <button class="react-btn" data-emoji="😱">😱</button>
        <button class="react-btn" data-emoji="🔥">🔥</button>
        <button class="react-btn" data-emoji="😭">😭</button>
      </div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Написать сообщение..." autocomplete="off" />
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const GOOGLE_API_KEY = "AIzaSyBcV_OlMU2CpZ1WO9n_bPF_j7CytgrZSuU";

    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get("room")?.trim() || "";

    const player = document.getElementById("player");
    const connBadge = document.getElementById("connBadge");
    const urlInput = document.getElementById("urlInput");
    const chatBox = document.getElementById("chatBox");
    const chatInput = document.getElementById("chatInput");
    const setupPanel = document.getElementById("setupPanel");
    const micBtn = document.getElementById("micBtn");
    const remoteAudio = document.getElementById("remoteAudio");
    const nameInput = document.getElementById("nameInput");
    const inviteBtn = document.getElementById("inviteBtn");

    nameInput.value = localStorage.getItem("cinema_username") || "";
    nameInput.addEventListener("input", () => {
      localStorage.setItem("cinema_username", nameInput.value.trim());
    });

    function getMyName() {
      return nameInput.value.trim() || (isHost ? "Хост" : "Гость");
    }

    let peer = null;
    let conn = null;
    let localStream = null;
    let isHost = !roomFromUrl;
    let currentRoomId = roomFromUrl || ("kino-" + Math.random().toString(36).substring(2, 8));
    let isRemoteAction = false;
    let currentRawUrl = "";

    function addChatMessage(sender, text, type = "other") {
      const div = document.createElement("div");
      if (type === "sys") {
        div.className = "msg sys";
        div.textContent = text;
      } else {
        div.className = "msg" + (type === "me" ? " me" : "");
        if (type !== "me") {
          const author = document.createElement("div");
          author.className = "msg-author";
          author.textContent = sender;
          div.appendChild(author);
        }
        const body = document.createElement("div");
        body.textContent = text;
        div.appendChild(body);
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function parseDriveUrl(input) {
      const clean = input.trim();
      const match = clean.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]{20,})/);
      if (match && match[1]) {
        return `https://www.googleapis.com/drive/v3/files/${match[1]}?alt=media&acknowledgeAbuse=true&key=${GOOGLE_API_KEY}`;
      }
      return clean;
    }

    function safePlay() {
      player.play().catch(() => {
        addChatMessage("", "Браузер заблокировал автозапуск — нажми Play на плеере один раз", "sys");
      });
    }

    async function loadVideo(rawUrl, startTime = 0, shouldPlay = false) {
      if (!rawUrl) return;
      currentRawUrl = rawUrl;
      urlInput.value = rawUrl;

      const streamUrl = parseDriveUrl(rawUrl);
      addChatMessage("", "Проверяю и загружаю видео...", "sys");

      try {
        const check = await fetch(streamUrl, {
          method: "GET",
          headers: { Range: "bytes=0-1" }
        });
        if (!check.ok) {
          let details = "";
          try {
            const errJson = await check.json();
            details = errJson.error?.message ? ` (${errJson.error.message})` : "";
          } catch (_) {}
          addChatMessage("", `Ошибка Google Диска [${check.status}]${details}: проверь доступ «Все, у кого есть ссылка»`, "sys");
          return;
        }
      } catch (e) {
        addChatMessage("", "Пробую открыть видео напрямую...", "sys");
      }

      isRemoteAction = true;
      player.src = streamUrl;
      player.currentTime = startTime;
      if (shouldPlay) safePlay();
      setTimeout(() => { isRemoteAction = false; }, 500);
    }

    player.addEventListener("error", () => {
      if (!player.src || player.src === window.location.href) return;
      const code = player.error?.code;
      const reason = code === 4
        ? "формат видео не поддерживается браузером (нужен .mp4 H.264/AAC, а не .mkv)"
        : "ошибка загрузки потока";
      addChatMessage("", `Ошибка плеера (код ${code || "?"}): ${reason}`, "sys");
    });

    function setupConnection(connection) {
      conn = connection;
      conn.on("open", () => {
        connBadge.textContent = "Вместе онлайн";
        connBadge.classList.add("online");
        addChatMessage("", "Партнёр подключился к комнате", "sys");

        if (isHost && currentRawUrl) {
          conn.send({
            type: "sync_full",
            url: currentRawUrl,
            time: player.currentTime,
            paused: player.paused
          });
        }

        if (localStream && conn?.peer) {
          const call = peer.call(conn.peer, localStream);
          call.on("stream", (stream) => { remoteAudio.srcObject = stream; });
        }
      });

      conn.on("data", (data) => {
        if (data.type === "load") {
          loadVideo(data.url, 0, false);
          addChatMessage("", "Загружено новое видео", "sys");
        } else if (data.type === "sync_full") {
          loadVideo(data.url, data.time, !data.paused);
        } else if (data.type === "action") {
          isRemoteAction = true;
          if (Math.abs(player.currentTime - data.time) > 0.7) player.currentTime = data.time;
          if (data.action === "play") safePlay();
          if (data.action === "pause") player.pause();
          setTimeout(() => { isRemoteAction = false; }, 400);
        } else if (data.type === "heartbeat") {
          if (!player.paused && Math.abs(player.currentTime - data.time) > 1.5) {
            isRemoteAction = true;
            player.currentTime = data.time;
            setTimeout(() => { isRemoteAction = false; }, 400);
          }
        } else if (data.type === "chat") {
          addChatMessage(data.sender, data.text, "other");
        }
      });

      conn.on("close", () => {
        connBadge.textContent = "Отключён";
        connBadge.classList.remove("online");
        addChatMessage("", "Партнёр вышел из комнаты", "sys");
      });
    }

    function initPeer() {
      if (peer) peer.destroy();
      peer = isHost ? new Peer(currentRoomId) : new Peer();

      peer.on("open", () => {
        addChatMessage("", `Комната создана. Код: ${currentRoomId}`, "sys");
        if (!isHost) {
          setupConnection(peer.connect(currentRoomId));
        }
      });

      peer.on("error", (err) => {
        if (err.type === "unavailable-id" && isHost) {
          currentRoomId = "kino-" + Math.random().toString(36).substring(2, 8);
          initPeer();
        } else if (err.type === "peer-unavailable") {
          addChatMessage("", "Комната не найдена — проверь, открыта ли вкладка у создателя", "sys");
        }
      });

      peer.on("connection", (incomingConn) => {
        setupConnection(incomingConn);
      });

      peer.on("call", (call) => {
        call.answer(localStream || undefined);
        call.on("stream", (stream) => {
          remoteAudio.srcObject = stream;
        });
      });
    }

    initPeer();

    player.addEventListener("play", () => {
      if (!isRemoteAction && conn?.open) conn.send({ type: "action", action: "play", time: player.currentTime });
    });
    player.addEventListener("pause", () => {
      if (!isRemoteAction && conn?.open) conn.send({ type: "action", action: "pause", time: player.currentTime });
    });
    player.addEventListener("seeked", () => {
      if (!isRemoteAction && conn?.open) conn.send({ type: "action", action: "seek", time: player.currentTime });
    });

    setInterval(() => {
      if (isHost && conn?.open && !player.paused) {
        conn.send({ type: "heartbeat", time: player.currentTime });
      }
    }, 5000);

    function sendMessage(customText = null) {
      const text = (customText ?? chatInput.value).trim();
      if (!text) return;
      const sender = getMyName();
      addChatMessage(sender, text, "me");
      if (conn?.open) conn.send({ type: "chat", sender, text });
      if (!customText) chatInput.value = "";
    }

    document.getElementById("sendBtn").onclick = () => sendMessage();
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    document.querySelectorAll(".react-btn").forEach((btn) => {
      btn.onclick = () => sendMessage(btn.dataset.emoji);
    });

    micBtn.onclick = async () => {
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
        micBtn.textContent = "🎙 Голос";
        micBtn.classList.remove("mic-on");
        addChatMessage("", "Микрофон выключен", "sys");
        return;
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micBtn.textContent = "🔴 В эфире";
        micBtn.classList.add("mic-on");
        addChatMessage("", "Микрофон включён", "sys");
        if (conn?.peer) {
          const call = peer.call(conn.peer, localStream);
          call.on("stream", (stream) => { remoteAudio.srcObject = stream; });
        }
      } catch (e) {
        alert("Браузер не дал доступ к микрофону. Разреши доступ в настройках сайта.");
      }
    };

    document.getElementById("toggleSetupBtn").onclick = () => {
      setupPanel.classList.toggle("hidden");
    };

    document.getElementById("loadBtn").onclick = () => {
      const url = urlInput.value.trim();
      if (!url) return;
      loadVideo(url, 0, false);
      if (conn?.open) conn.send({ type: "load", url });
      setupPanel.classList.add("hidden");
    };

    inviteBtn.onclick = async () => {
      const baseUrl = window.location.origin + window.location.pathname;
      const inviteLink = `${baseUrl}?room=${currentRoomId}`;
      try {
        await navigator.clipboard.writeText(inviteLink);
        const origText = inviteBtn.textContent;
        inviteBtn.textContent = "✓ Скопировано!";
        setTimeout(() => { inviteBtn.textContent = origText; }, 2200);
      } catch (_) {
        prompt("Скопируй ссылку для партнёра:", inviteLink);
      }
    };

    document.getElementById("joinBtn").onclick = () => {
      const raw = document.getElementById("joinInput").value.trim();
      if (!raw) return;
      const match = raw.match(/room=([a-zA-Z0-9-]+)/);
      currentRoomId = match ? match[1] : raw;
      isHost = false;
      initPeer();
      setupPanel.classList.add("hidden");
    };
  </script>
</body>
</html>
